# srvctl – globale Standardkonfiguration
#
# Ladereihenfolge (spätere Dateien überschreiben frühere):
#   1. config/default.conf          (diese Datei)
#   2. config/hosts/<hostname>.conf  (pro Server)
#   3. config/local.conf             (lokal, nicht in Git – z. B. für Geheimnisse)
#   4. --config DATEI
#
# Format: Bash-Variablen (NAME="wert", Listen als "a b c").
# Konvention: Modul-Einstellungen beginnen mit dem Modulnamen (EXAMPLE_...).

# --- Framework ----------------------------------------------------------------
#SRVCTL_LOG_FILE="/var/log/srvctl.log"
#SRVCTL_BACKUP_DIR="/var/backups/srvctl"
#SRVCTL_BACKUP_KEEP=30            # Anzahl aufbewahrter Backup-Läufe
#SRVCTL_STATE_DIR="/var/lib/srvctl"
#SRVCTL_CONFIRM_TIMEOUT=300       # Sekunden bis zum automatischen Zurücksetzen
#SRVCTL_FIREWALL_DIR="/etc/srvctl/firewall.d"
#SRVCTL_IGNORE_PATH_WARNING=0     # 1 = Warnung zu unsicheren Elternverzeichnissen aus

MODULES_ENABLED=""                # Module für "all" (leer = alle)
MODULES_DISABLED="example"        # von "all" ausgenommen

# --- Modul: base -------------------------------------------------------------
BASE_AUTO_REBOOT=""               # z. B. "03:30" = bei Bedarf automatisch neu starten; leer = nur melden
BASE_NEEDRESTART="auto"           # Dienste nach Updates: auto = neu starten, list = nur melden
BASE_NTS_SERVERS="ptbtime1.ptb.de ptbtime2.ptb.de ptbtime3.ptb.de nts.netnod.se time.cloudflare.com"
BASE_TIME_REQUIRE_NTS=1           # 0 = auch Zeitquellen ohne NTS zulassen (z. B. interner NTP-Server)
BASE_TIME_SERVERS=""              # zusätzliche Zeitserver ohne NTS (nur sinnvoll mit BASE_TIME_REQUIRE_NTS=0)
BASE_TIMEZONE="Europe/Berlin"
BASE_LOCALE="en_US.UTF-8"         # Systemsprache
BASE_LOCALES_EXTRA="de_DE.UTF-8"  # zusätzlich erzeugt
BASE_APT_ALLOWED_SOURCES="packagecloud.io/crowdsec/crowdsec/*"  # erlaubte Fremdquellen (Muster ohne Schema)
BASE_PACKAGES_INSTALL="needrestart debsecan apt-listchanges ca-certificates debsums apt-show-versions"
BASE_PACKAGES_REMOVE="telnet inetutils-telnet rsh-client nis talk ftp tnftp inetutils-ftp avahi-daemon cups xinetd rpcbind"

# --- Modul: users ------------------------------------------------------------
# Admin-Namen und Schlüssel werden bei "srvctl setup users" interaktiv abgefragt.
USERS_PASS_MINLEN=14              # Mindestlänge (keine Zeichenklassen, kein Ablauf)
USERS_FAILLOCK_DENY=5             # Fehlversuche bis zur Sperre
USERS_FAILLOCK_UNLOCK=900         # Sperrdauer in Sekunden
USERS_SUDO_TIMEOUT=5              # Minuten bis sudo erneut nach dem Passwort fragt
USERS_UMASK=027

# --- Modul: ssh --------------------------------------------------------------
SSH_PORT=22
SSH_ALLOW_GROUPS=""               # weitere Gruppen mit SSH-Zugang (z. B. "git sftpusers"); Admins: sshusers
SSH_ALLOW_TCP_FORWARDING="local"  # Tunnel mit -L erlaubt, kein -R
SSH_ALLOW_AGENT_FORWARDING="no"   # stattdessen ProxyJump (-J)
SSH_REQUIRE_SK=0                  # 1 = nur noch FIDO2-Hardware-Schlüssel
SSH_CLIENT_ALIVE_INTERVAL=300     # tote Verbindungen nach 2 × 300 s trennen
SSH_MAX_SESSIONS=4                # Sitzungen pro Verbindung (Multiplexing, VS Code Remote)
# Hinweis vor der Anmeldung (SSH, /etc/issue, /etc/issue.net); Lynis erwartet englische Schlüsselwörter
SSH_BANNER_TEXT=$'Zugriff nur für berechtigte Personen. Alle Aktivitäten werden protokolliert.\nAuthorized access only. All activity is logged and monitored; unauthorized use is prohibited and may be prosecuted.'

# --- Modul: firewall ---------------------------------------------------------
# SSH (SSH_PORT) ist immer offen. Weitere Ports pro Server in config/hosts/<host>.conf.
FIREWALL_TCP_PORTS=""             # z. B. "80 443" oder Bereiche "8000-8100"
FIREWALL_UDP_PORTS=""
FIREWALL_BLOCK_OK=""              # Dienste, die bewusst nicht erreichbar sein sollen, z. B. "tcp/3306"
FIREWALL_SSH_ALLOW=""             # SSH nur von diesen IPs/Netzen (in local.conf, Repo ist öffentlich)
FIREWALL_SSH_RATE="10/minute"     # neue SSH-Verbindungen pro Quell-IP (plus Spielraum von 10)
FIREWALL_OUTPUT_POLICY="accept"   # drop = ausgehend nur DNS, HTTP(S), NTP/NTS, DHCP + FIREWALL_OUT_*
FIREWALL_OUT_TCP_PORTS=""
FIREWALL_OUT_UDP_PORTS=""
FIREWALL_LOG_DROPS=0              # 1 = verworfene Pakete (begrenzt) ins Kernel-Log

# --- Modul: crowdsec ---------------------------------------------------------
CROWDSEC_BAN_HOURS=4              # erste Sperre in Stunden; Wiederholungen: × (Anzahl bisheriger Sperren + 1)
CROWDSEC_COLLECTIONS=""           # zusätzlich zu crowdsecurity/linux und sshd-impossible-travel
CROWDSEC_WHITELIST=""             # nie sperren (IPs/Netze; in local.conf, Repo ist öffentlich)
#CROWDSEC_ENROLL_KEY=""           # Web-Console-Anmeldung – NUR in config/local.conf eintragen

# --- Modul: kernel -----------------------------------------------------------
KERNEL_PTRACE_SCOPE=1             # 1 = nur eigene Kindprozesse debuggen; 2 = nur root; 3 = gar nicht
KERNEL_UNPRIV_USERNS=1            # 0 = unprivilegierte User-Namespaces aus (bricht Rootless-Container)
KERNEL_TMP_NOEXEC=0               # 1 = /tmp und /var/tmp zusätzlich mit noexec
KERNEL_BLACKLIST_EXTRA=""         # weitere zu sperrende Kernelmodule

# --- Modul: services ---------------------------------------------------------
SERVICES_MAIL_SERVER=""           # 1 = Mailserver nimmt Mails von außen an, 0 = auf localhost beschränken
SERVICES_CRON_USERS=""            # weitere Benutzer für cron/at (Besitzer vorhandener Crontabs automatisch)
SERVICES_ALLOWED=""               # Prozesse, die zusätzlich öffentlich lauschen dürfen (z. B. "nginx")
SERVICES_DISABLE="avahi-daemon cups cups-browsed rpcbind nfs-server smbd nmbd snmpd bluetooth ModemManager"

# --- Modul: logging ----------------------------------------------------------
LOGGING_RETENTION="90d"           # journald-Aufbewahrung
LOGGING_MAX_USE="1G"              # journald höchstens
LOGGING_AUDIT_IMMUTABLE=0         # 1 = Audit-Regeln bis zum Neustart unveränderbar (-e 2)
LOGGING_AUDIT_LOG_MB=50           # Größe einer audit.log-Datei
LOGGING_AUDIT_LOG_FILES=10        # Anzahl rotierter audit.log-Dateien

# --- Modul: apparmor ---------------------------------------------------------
APPARMOR_ENFORCE=""               # Profile (Dateinamen in /etc/apparmor.d) zusätzlich auf enforce stellen
APPARMOR_UNCONFINED_OK="sshd"     # dürfen ohne Profil öffentlich lauschen

# --- Modul: audit ------------------------------------------------------------
AUDIT_MIN_SCORE=80                # Lynis-Hardening-Index: ab hier OK
AUDIT_FAIL_SCORE=70               # darunter FAIL, dazwischen WARN
AUDIT_MAX_AGE_DAYS=7              # Bericht so lange wiederverwenden (--fresh erzwingt neuen Lauf)
AUDIT_EXCEPTIONS=""               # weitere bewusste Ausnahmen, z. B. "BOOT-5122 SSH-7408:MAXSESSIONS"

# --- Modul: example -----------------------------------------------------------
EXAMPLE_CONF_FILE="/etc/srvctl/example.conf"
EXAMPLE_GREETING="Hallo"
EXAMPLE_DISK_WARN=80
EXAMPLE_DISK_FAIL=90
