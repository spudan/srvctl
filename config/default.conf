# srvctl – globale Standardkonfiguration
#
# Ladereihenfolge (spätere Dateien überschreiben frühere):
#   1. config/default.conf          (diese Datei)
#   2. config/hosts/<hostname>.conf  (pro Server)
#   3. config/local.conf             (lokal, nicht in Git – z. B. für Geheimnisse)
#   4. --config DATEI
#
# Format: Bash-Variablen (NAME="wert", Listen als "a b c").
# Konvention: Modul-Einstellungen beginnen mit dem Modulnamen (EXAMPLE_...).

# --- Framework ----------------------------------------------------------------
#SRVCTL_LOG_FILE="/var/log/srvctl.log"
#SRVCTL_BACKUP_DIR="/var/backups/srvctl"
#SRVCTL_BACKUP_KEEP=30            # Anzahl aufbewahrter Backup-Läufe
#SRVCTL_STATE_DIR="/var/lib/srvctl"
#SRVCTL_CONFIRM_TIMEOUT=300       # Sekunden bis zum automatischen Zurücksetzen
#SRVCTL_FIREWALL_DIR="/etc/srvctl/firewall.d"
#SRVCTL_IGNORE_PATH_WARNING=0     # 1 = Warnung zu unsicheren Elternverzeichnissen aus

MODULES_ENABLED=""                # Module für "all" (leer = alle)
MODULES_DISABLED="example"        # von "all" ausgenommen

# --- Modul: base -------------------------------------------------------------
BASE_AUTO_REBOOT=""               # z. B. "03:30" = bei Bedarf automatisch neu starten; leer = nur melden
BASE_NEEDRESTART="auto"           # Dienste nach Updates: auto = neu starten, list = nur melden
BASE_NTS_SERVERS="ptbtime1.ptb.de ptbtime2.ptb.de ptbtime3.ptb.de nts.netnod.se time.cloudflare.com"
BASE_TIMEZONE="Europe/Berlin"
BASE_LOCALE="en_US.UTF-8"         # Systemsprache
BASE_LOCALES_EXTRA="de_DE.UTF-8"  # zusätzlich erzeugt
BASE_APT_ALLOWED_SOURCES=""       # erlaubte Fremdquellen, Muster ohne Schema, z. B. "rspamd.com/*"
BASE_PACKAGES_INSTALL="needrestart debsecan apt-listchanges ca-certificates"
BASE_PACKAGES_REMOVE="telnet inetutils-telnet rsh-client nis talk ftp tnftp inetutils-ftp avahi-daemon cups xinetd rpcbind"

# --- Modul: example -----------------------------------------------------------
EXAMPLE_CONF_FILE="/etc/srvctl/example.conf"
EXAMPLE_GREETING="Hallo"
EXAMPLE_DISK_WARN=80
EXAMPLE_DISK_FAIL=90
